<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recensione inviata · VOLTRA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#C6F432;--bg:#0B0C0A;--panel:#151612;--ink:#F4F1E8;--muted:#C9C5B8;--line:rgba(244,241,232,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:620px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.ok{width:96px;height:96px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Unbounded',sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(34px,7vw,56px);line-height:1.02;margin:0}
p{margin:0;font-size:18px;line-height:1.65;color:var(--muted)}
.steps{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:8px}
.steps div{padding:18px 20px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-size:16px;font-weight:700;display:flex;gap:14px;align-items:center}
.steps b{font-family:'Unbounded',sans-serif;color:var(--accent);font-size:18px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
a.btn{display:inline-flex;align-items:center;gap:10px;padding:18px 26px;border-radius:999px;text-decoration:none;font-weight:800;font-size:16px}
.wa{background:#3CD66B;color:var(--bg)}
.home{border:1px solid rgba(244,241,232,.3);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.ok{animation:none}}
</style>
</head>
<body>
<main class="box">
  <div class="ok"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#0B0C0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
  <h1>Grazie!<br><span style="color:var(--accent)">Recensione ricevuta.</span></h1>
  <p>La leggo personalmente e, dopo aver verificato l’ordine, la pubblico sul sito. Grazie per aver dedicato un minuto a raccontare la tua esperienza: aiuta chi deve ancora decidere.</p>
  <div class="btns">
    <a class="btn home" href="index.html#recensioni">Torna al sito</a>
  </div>
</main>
</body>
</html>
